[project]
name = "deep_research_lib"
version = "0.1.0"
description = "A Python library for deep research using LLMs"
authors = [
    { name = "Satyabrata Tripathy", email = "isatyabrata@hotmail.com" }
]
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "openai==1.63.0",
    "tiktoken==0.9.0",
    "pydantic==2.10.6",
    "httpx==0.28.1",
    "pip>=25.0.1",
    "python-dotenv==0.19.1",
    "json-repair==0.36.1",
    "firecrawl-py==1.12.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
